<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">WasteTrack dashboard wireframe</title>
  <desc id="description">Low-fidelity desktop and mobile dashboard layouts for the WasteTrack waste management application.</desc>
  <style>
    .canvas { fill: #f1f2ef; }
    .frame { fill: #fff; stroke: #9da29d; stroke-width: 1.5; }
    .surface { fill: #f7f8f6; stroke: #c8ccc7; stroke-width: 1; }
    .block { fill: #e8eae7; }
    .block-dark { fill: #d8dcd7; }
    .line { fill: none; stroke: #b9beb9; stroke-width: 1; }
    .line-dark { fill: none; stroke: #929992; stroke-width: 1.25; }
    .dashed { fill: none; stroke: #b9beb9; stroke-width: 1; stroke-dasharray: 4 4; }
    .label { fill: #3f4540; font: 600 12px Arial, sans-serif; }
    .small { fill: #6d736e; font: 10px Arial, sans-serif; }
    .tiny { fill: #858b86; font: 8px Arial, sans-serif; letter-spacing: .8px; }
    .heading { fill: #303631; font: 700 20px Arial, sans-serif; }
    .subheading { fill: #414742; font: 700 13px Arial, sans-serif; }
    .metric { fill: #343a35; font: 700 23px Arial, sans-serif; }
    .mobile-heading { fill: #303631; font: 700 16px Arial, sans-serif; }
    .mobile-copy { fill: #666d67; font: 9px Arial, sans-serif; }
    .tag { fill: #e8eae7; stroke: #b9beb9; stroke-width: 1; }
  </style>

